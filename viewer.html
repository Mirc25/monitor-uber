<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUNDO SEGURIDAD - VIEWER</title>
    <script src="./vendor/peerjs.min.js"></script>
    <link rel="stylesheet" href="./vendor/leaflet.css" />
    <script src="./vendor/leaflet.js"></script>
    <script src="./js/config.js"></script>
    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/viewer-main.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --vip-bg: #05070c;
            --vip-card: #0d1628;
            --vip-border: #294d8a;
            --vip-ink: #e7f0ff;
            --vip-muted: #9ab2de;
            --vip-accent: #2bdcff;
            --vip-accent-2: #6bffaf;
            --vip-danger: #ff5f7d;
        }
        body {
            background: radial-gradient(circle at 10% 10%, #13223d 0%, var(--vip-bg) 45%), linear-gradient(140deg, #060a14, #070b11 70%);
            color: var(--vip-ink);
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
        }

        #statusBar {
            background: linear-gradient(180deg, #0d1b32, #0a1324);
            border-bottom: 1px solid var(--vip-border);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: bold;
        }
        #dot { width: 12px; height: 12px; border-radius: 50%; background: var(--vip-danger); flex-shrink: 0; }
        #dot.on { background: var(--vip-accent-2); box-shadow: 0 0 10px rgba(107, 255, 175, 0.65); animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:0.4; } }

        #videoWrap {
            flex: 1 1 55%;
            background: #090f1b;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            border-bottom: 1px solid #203a66;
        }
        #remoteVideo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
            border-radius: 12px;
            border: 1px solid #2d446f;
        }
        #placeholder {
            text-align: center;
            color: var(--vip-muted);
            padding: 20px;
        }
        #placeholder .icon { font-size: 48px; margin-bottom: 10px; }

        #mapWrap {
            flex: 0 0 45%;
            position: relative;
        }
        #map { width: 100%; height: 100%; }
        #mapLabel {
            position: absolute;
            top: 6px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: var(--vip-accent-2);
            font-size: 11px;
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 10px;
            z-index: 1000;
            white-space: nowrap;
        }

        #audioHint {
            display: none;
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(8, 16, 28, 0.9);
            color: var(--vip-ink);
            border: 1px solid var(--vip-border);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            z-index: 5;
        }

        #endMsg {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 16px;
        }
        #endMsg .big { font-size: 52px; }
        #endMsg h2 { color: #f44; font-size: 22px; }
        #endMsg p { color: #aaa; font-size: 14px; max-width: 300px; }
    </style>
</head>
<body>

<div id="statusBar">
    <div id="dot"></div>
    <span id="statusText">Conectando con la unidad...</span>
</div>

<div id="videoWrap">
    <video id="remoteVideo" autoplay playsinline></video>
    <div id="placeholder">
        <div class="icon">ðŸ“¡</div>
        <p>Esperando stream de video...</p>
    </div>
    <button id="audioHint" type="button">Tocar para activar audio</button>
</div>

<div id="mapWrap">
    <div id="mapLabel">ðŸ“ UBICACIÃ“N EN TIEMPO REAL</div>
    <div id="map"></div>
</div>

<div id="endMsg" role="alert">
    <div class="big">ðŸ”´</div>
    <h2>SesiÃ³n finalizada</h2>
    <p>El conductor terminÃ³ el viaje compartido o la app se cerrÃ³.</p>
</div>

<script src="./js/viewer-inline-1.js"></script>
</body>
</html>
