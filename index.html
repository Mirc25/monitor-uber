<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V.I.P. SJ</title>
    <script src="./vendor/peerjs.min.js"></script>
    <script src="./vendor/capacitor.js"></script>
    <script src="./vendor/qrcode.min.js"></script>
    <script src="./js/config.js"></script>
    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/index-main.js"></script>
    <link href="./vendor/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --vip-bg: #05070c;
            --vip-card: #0c1220;
            --vip-border: #1f355e;
            --vip-ink: #dfe9ff;
            --vip-muted: #8ea4d3;
            --vip-accent: #2bdcff;
            --vip-accent-2: #6bffaf;
            --vip-danger: #ff5f7d;
        }
        body {
            background: radial-gradient(circle at 10% 10%, #13223d 0%, var(--vip-bg) 45%), linear-gradient(140deg, #060a14, #070b11 70%);
            color: var(--vip-ink);
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
        }
        .container {
            max-width: 520px;
            margin-top: 16px;
            border: 1px solid var(--vip-border);
            padding: 18px;
            border-radius: 18px;
            background: linear-gradient(165deg, #0d1628, #0a0f1a 75%);
            box-shadow: 0 16px 42px rgba(0, 0, 0, 0.45);
        }
        .brand-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(155deg, var(--vip-accent), var(--vip-accent-2));
            color: #061018;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 3px rgba(43, 220, 255, 0.2), 0 10px 18px rgba(18, 44, 70, 0.45);
            position: relative;
            overflow: hidden;
        }
        .brand-mark::before {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 10px;
            border: 1px solid rgba(6, 18, 31, 0.3);
            background: linear-gradient(155deg, rgba(255, 255, 255, 0.18), rgba(8, 28, 43, 0.05));
        }
        .brand-mark span {
            position: relative;
            z-index: 1;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.7px;
        }
        h2 {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 24px;
            letter-spacing: 1.2px;
        }
        .brand-sub {
            display: block;
            margin-top: -2px;
            color: var(--vip-muted);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .form-control {
            border: 1px solid #2a3f69 !important;
            color: var(--vip-ink) !important;
        }
        video {
            width: 82%;
            max-height: 170px;
            border-radius: 12px;
            border: 1px solid #2d446f;
            transform: scaleX(-1);
            box-shadow: inset 0 0 20px rgba(22, 37, 68, 0.35);
            margin: 8px auto 0;
            display: block;
        }
        .btn-pablo {
            background: linear-gradient(120deg, var(--vip-accent), var(--vip-accent-2));
            color: #041017;
            font-weight: 700;
            border: none;
            letter-spacing: 0.6px;
        }
        .btn-outline-pablo {
            background: #0f1a2d;
            color: var(--vip-accent);
            border: 1px solid #2d4f8b;
            font-weight: 700;
            letter-spacing: 0.6px;
        }
        .status-dot { height: 10px; width: 10px; background: var(--vip-danger); border-radius: 50%; display: inline-block; }
        .status-on { background: var(--vip-accent-2); box-shadow: 0 0 10px rgba(107, 255, 175, 0.7); }
        #misVideosPanel {
            display: none;
            margin-top: 12px;
            border: 1px solid #2a4d88;
            border-radius: 12px;
            padding: 12px;
            max-height: 380px;
            min-height: 230px;
            overflow-y: auto;
            text-align: left;
            background: linear-gradient(180deg, #0d1b32, #0a1324);
        }
        #misVideosPanel strong {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 0.8px;
        }
        #qrModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.86);
            z-index: 15000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .qr-box {
            width: 100%;
            max-width: 420px;
            border: 1px solid #2a4d88;
            border-radius: 14px;
            background: linear-gradient(165deg, #0d1628, #0a0f1a 75%);
            box-shadow: 0 16px 42px rgba(0, 0, 0, 0.45);
            padding: 14px;
            text-align: center;
        }
        #qrCanvasWrap {
            margin: 10px auto;
            width: 260px;
            min-height: 260px;
            border-radius: 10px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }
        #qrStatus {
            font-size: 13px;
            font-weight: bold;
            color: #9be7ff;
            margin-bottom: 6px;
        }
        #qrLinkText {
            font-size: 11px;
            color: #9ab2de;
            word-break: break-all;
            margin-bottom: 8px;
        }
        .video-item {
            border: 1px solid #234171;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            background: linear-gradient(145deg, #11203a, #0a1323);
        }
        .video-item .meta {
            font-size: 12px;
            color: #9ab2de;
            word-break: break-word;
        }
        .video-item strong {
            color: #ecf3ff;
            font-size: 15px;
            letter-spacing: 0.3px;
        }
        #pipBadge {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 18% 20%, rgba(35, 84, 124, 0.5), rgba(3, 8, 14, 0.98) 60%);
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .pip-card {
            width: 88%;
            max-width: 260px;
            border-radius: 24px;
            padding: 14px 14px 12px;
            border: 1px solid rgba(92, 201, 255, 0.45);
            background: linear-gradient(165deg, rgba(7, 19, 32, 0.96), rgba(3, 9, 16, 0.96) 70%);
            box-shadow: 0 12px 26px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        .pip-brand {
            display: flex;
            align-items: center;
            gap: 9px;
        }
        .pip-logo {
            width: 34px;
            height: 34px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #33e7ff, #7dffbf);
            color: #052130;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 10px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 0 2px rgba(43, 220, 255, 0.2);
        }
        .pip-brand h4 {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 1px;
            color: #e5f2ff;
        }
        .pip-brand p {
            margin: 0;
            color: #98b6de;
            font-size: 10px;
            letter-spacing: 1.6px;
            text-transform: uppercase;
        }
        .pip-status {
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 10px;
            border: 1px solid rgba(95, 171, 255, 0.35);
            border-radius: 12px;
            background: rgba(9, 22, 37, 0.72);
        }
        .pip-live {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #dcf3ff;
            font-weight: 700;
            font-size: 12px;
        }
        .pip-live-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #6bffaf;
            box-shadow: 0 0 0 4px rgba(107, 255, 175, 0.15), 0 0 8px rgba(107, 255, 175, 0.9);
            animation: pipPulse 1.25s ease-in-out infinite;
        }
        .pip-note {
            color: #8fb4de;
            font-size: 10px;
            letter-spacing: 0.4px;
        }
        @keyframes pipPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.74); opacity: 0.55; }
        }
        body.pip-hidden {
            background: #02060b;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        body.pip-hidden .container {
            display: none !important;
        }
        body.pip-hidden #pipBadge {
            display: flex;
        }
    </style>
</head>
<body>
    <div id="pipBadge">
        <div class="pip-card">
            <div class="pip-brand">
                <div class="pip-logo">VIP</div>
                <div>
                    <h4>V.I.P. SJ</h4>
                    <p>Secure Unit</p>
                </div>
            </div>
            <div class="pip-status">
                <div class="pip-live"><span class="pip-live-dot"></span>EN VIVO</div>
                <div class="pip-note">Monitoreo activo</div>
            </div>
        </div>
    </div>
    <div id="app-content" class="container text-center">
        <div class="brand-wrap">
            <div class="brand-mark"><span>VIP</span></div>
            <div>
                <h2>V.I.P. SJ</h2>
                <span class="brand-sub">Secure Unit Console</span>
            </div>
        </div>
        <div id="setup">
            <input type="text" id="unidadId" class="form-control bg-dark text-success mb-2" placeholder="ID UNIDAD">
            <input type="text" id="tokenAcceso" class="form-control bg-dark text-success mb-2" placeholder="TOKEN" maxlength="4">
            <button class="btn btn-pablo w-100" onclick="validarYActivar()">ACTIVAR</button>
        </div>
        <div id="monitor-activo" style="display:none;">
            <div><span id="dot" class="status-dot"></span> <span id="statusText">CONECTANDO...</span></div>
            <video id="localVideo" autoplay muted playsinline></video>
            <div class="d-grid gap-2 mt-2">
                <button class="btn btn-outline-pablo" onclick="abrirQrViaje()">QR VIAJE 8 MIN</button>
                <button class="btn btn-outline-pablo" onclick="toggleMisVideos()">MIS VIDEOS</button>
                <button class="btn btn-outline-danger" onclick="cerrarSesionYSalir()">CERRAR SESION</button>
            </div>
            <div id="misVideosPanel">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <strong>MIS VIDEOS</strong>
                    <button class="btn btn-sm btn-outline-pablo" onclick="cargarMisVideos()">ACTUALIZAR</button>
                </div>
                <div id="misVideosList" class="small">Sin videos aÃºn.</div>
            </div>
        </div>
    </div>

    <div id="qrModal">
        <div class="qr-box">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <strong>QR DE VIAJE</strong>
                <button class="btn btn-sm btn-outline-danger" onclick="cerrarQrViaje()">CERRAR</button>
            </div>
            <div id="qrStatus">Generando QR...</div>
            <div id="qrCanvasWrap"></div>
            <div id="qrLinkText"></div>
            <div class="d-grid gap-2">
                <button class="btn btn-sm btn-outline-pablo" onclick="regenerarQrViaje()">REGENERAR QR</button>
                <button class="btn btn-sm btn-pablo" onclick="copiarLinkQrViaje()">COPIAR LINK</button>
            </div>
        </div>
    </div>

    <script src="./js/index-inline-1.js"></script>
</body>
</html>
